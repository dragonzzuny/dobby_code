name: ci

# The matrix is the point. This harness ships four cross-platform fixes that a
# single-OS pipeline would not have caught (interpreter name, stdio encoding,
# child-process env, path separators), so every push must prove them on all
# three platforms rather than on the maintainer's laptop.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install the only dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: engine tests
        run: python -m unittest discover -s tests -q

      # Non-ASCII output must survive on a non-UTF-8 default locale. Without the
      # UTF-8 pinning in dobby/core/platform.py this step fails on Windows.
      - name: unicode round-trip
        run: python -c "import sys; sys.path.insert(0,'.'); from dobby.core.platform import force_utf8_io; force_utf8_io(); print('em—dash 한국어 OK')"

      - name: bootstrap scan
        run: python -m dobby.cli init --scan .

      - name: doctor
        run: python -m dobby.cli doctor

      - name: self-check slice (routes, executes, evaluates, hands off)
        run: python -m dobby.cli slice --scenario SELF-CHECK

      - name: retrieval optimizer smoke
        run: python -m dobby.cli optimize --seeds 0 --iters 5 --pop 6

      - name: DESIGN.md validates
        run: python -m dobby.cli design

      # Availability detection must never crash when nothing is installed —
      # a CI runner has none of the agent CLIs, which is the honest zero case.
      - name: fleet reports an empty fleet without failing
        run: python -m dobby.cli fleet

  mcp:
    name: mcp gateway protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip PyYAML
      - name: four meta-tools only (progressive disclosure)
        run: python -m unittest tests.test_mcp_server -v
